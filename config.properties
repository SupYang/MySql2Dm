# =====================================================================
# MySQL -> 达梦(DM8) 表结构与数据迁移工具 配置文件
# 用法: java -jar mysql2dm.jar --config config.properties
#       所有配置项均可用命令行覆盖: --键=值 或 --键 值
#       例: java -jar mysql2dm.jar --config config.properties --mode data
# =====================================================================

# ---------------- 源库 MySQL ----------------
# URL 必须包含数据库名。缺少的关键参数(字符集/零日期转换/tinyInt1isBit等)工具会自动补充。
# 注意: 工具自动追加 zeroDateTimeBehavior=convertToNull，即源库零日期(0000-00-00)读出为 NULL；
#       如需遇零日期直接报错，可在 URL 显式设置 zeroDateTimeBehavior=exception。
mysql.url=jdbc:mysql://127.0.0.1:3306/mydb?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
mysql.user=root
mysql.password=你的密码

# ---------------- 目标库 达梦 DM8 ----------------
dm.url=jdbc:dm://127.0.0.1:5236
dm.user=SYSDBA
dm.password=SYSDBA
# 留空 = 使用 dm.user 登录用户的默认模式；指定则在所有 DDL/DML 中加模式限定
# 【重要】达梦实例必须以 CASE_SENSITIVE=Y(大小写敏感) 初始化，工具启动时会自动检测，
#         否则无法保留 MySQL 表名/字段名原始大小写(requireCaseSensitive=true 时直接终止)。
dm.schema=

# ---------------- 迁移范围 ----------------
# all=结构+数据(默认)  structure=仅结构  data=仅数据(要求目标表已存在)
mode=all
# 仅迁移指定表(逗号分隔，大小写不敏感)。留空=全部基表
tables=
# 排除表(逗号分隔，大小写不敏感)
excludeTables=

# ---------------- 表结构选项 ----------------
# 目标表已存在时: skip=跳过建表(默认)  recreate=删了重建  fail=报错终止
createStrategy=skip
# VARCHAR/CHAR 长度换算系数，默认 1 = 长度原样迁移(不扩宽)
# 仅当达梦按字节计长(LENGTH_IN_CHAR=0)且数据含中文/emoji 出现「数据超长」报错时，再调大至 3~4
varcharExpandFactor=1
# 迁移表/列注释(COMMENT ON)
migrateComments=true
# 迁移二级索引(唯一索引/普通索引；主键随建表创建)。索引/外键在数据装载完成后创建
migrateIndexes=true
# 迁移外键
migrateForeignKeys=true
# 遇到达梦无法映射的列(空间类型/生成列等)时:
#   false=直接终止(默认，保证数据零丢失)  true=跳过该列继续(该列数据将缺失，请谨慎!)
ignoreUnsupported=false

# ---------------- 数据选项 ----------------
# 批量插入每批行数。含 BLOB/TEXT 大字段的表建议调小(如 200)
batchSize=1000
# 每 N 行提交一次事务
commitRows=10000
# 进度日志间隔(行)
progressRows=50000
# 迁移数据前先清空(TRUNCATE)目标表
truncateBeforeLoad=false
# 行写入失败时: abort=打印字段级诊断后终止(默认，保证数据零丢失)  continue=跳过该行继续(将计入失败并使退出码非0)
onInsertError=abort
# 迁移完成后逐表校验源/目标行数
verifyCounts=true

# ---------------- 其他 ----------------
# 目标达梦实例为大小写不敏感初始化时是否终止(见 dm.schema 处说明)
requireCaseSensitive=true
# 模拟运行: 只连 MySQL 打印将执行的 DDL 与行数，不连达梦、不写入
dryRun=false
# 运行日志文件(追加写入，UTF-8)。留空=仅输出到控制台
logFile=mysql2dm.log
